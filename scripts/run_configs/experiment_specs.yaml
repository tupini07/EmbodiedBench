###############################################
# EmbodiedBench Experiment Specifications
# ---------------------------------------
# This file centralizes the definition of experiment batches that were
# previously scattered across many .nu scripts. A helper script
# `run_all_yaml.nu` will:
#   1. Parse this YAML
#   2. Deep-merge each experiment's overrides onto `base_settings`
#   3. Invoke `run_batch` for each experiment (or skip if already done)
# SCHEMA OVERVIEW
# ---------------
# schema_version: Int – bump if structure changes in a breaking way.
# base_settings:  Defaults applied to every experiment unless overridden.
#   temps:                List[Float]    -> Temperature values passed to run_batch
#   max_tokens:           List[Int]      -> Token limits list passed to run_batch
#   stop_seqs:            List[String]   -> First value used as --stop_seqs (extend if needed)
#   prefix:               String         -> Default prefix for experiment names (can be empty)
#   replicates:           Int            -> Passed to run_batch --replicates
#   skip_if_done:         Bool           -> Passed to run_batch --skip_if_done
#   no_pause:             Bool           -> If true, adds --no_pause to run_batch
#   amlt_job_names:       List[String]   -> If non-empty, start SSH tunnels (mapped one-to-one to remote_urls)
#   remote_urls:          String         -> Comma-separated URLs (for start_ssh_tunnels + REMOTE_URL patching)
#   extra_env:            Map[String,String] -> Base environment variables merged (shallow) + deep merge for nested maps.

# experiments: List of experiment definitions.
#   - name:        Unique short name (used for run directory + prefix fallback)
#     description: Human-readable explanation
#     tags:        Optional list for ad-hoc filtering in tooling (e.g. debug, reasoning, habitat-only)
#     enabled:     Bool (default true) – if false, skip completely
#     overrides:   Partial structure mirroring base_settings keys + extra_env.
#                  Precedence: experiment overrides > base_settings.
#                  Merge semantics:
#                      * Simple scalars replace
#                      * Lists replace entirely (you can repeat base values if desired)
#                      * extra_env merges key-wise (override adds/replaces only specified keys)

# EXAMPLE MERGE (pseudo-nu):
#   let merged_extra_env = ($base.extra_env | merge ($exp.overrides.extra_env? | default {}))
# 
# NOTES:
#  * Force rerun semantics: Set extra_env.FORCE_RERUN="1" to purge prior done markers
#  * Selective benchmarks: RUN_ALFRED / RUN_HABITAT / (future RUN_MANIPULATION / RUN_NAV)
#  * Debug toggles: DEBUG_REMOTE_MODEL_INPUTS / DEBUG_REMOTE_MODEL_OUTPUTS
#  * Planning toggles: ONLY_ONE_STEP_PLAN, EMB_PLANNER_RETRY_TIMES, EMB_REASONING_MODE
#  * Duration logs suppression: EB_SUPRESS_DURATION_LOGS="1" to hide timing output
#  * You can vary MODEL_NAME per experiment if needed.
# 
# FUTURE EXTENSIONS (possible keys under overrides):
#   headless: Bool -> would set HEADLESS=1 in extra_env automatically
#   max_concurrent: Int -> limit parallel spawns (implemented in run_all_yaml.nu)

base_settings:
  stop_seqs: ["</answer>"]
  replicates: 3
  skip_if_done: true
  no_pause: true
  extra_env:
    DEBUG_REMOTE_MODEL_INPUTS: "1"                # print model inputs to the log
    DEBUG_REMOTE_MODEL_OUTPUTS: "1"               # print model outputs to the log
    
    EMB_PLANNER_RETRY_TIMES: "3"                  # how many times to retry planning if failed or empty plan
    EMB_REASONING_MODE: "1"                       # whether to add the reasoning prompt postfix
    ONLY_ONE_STEP_PLAN: "1"                       # model is asked to produce only one-step plans
    WRAP_IN_CONTEXT_EXAMPLES_WITH_BOX_TAGS: "1"   # wrap in <begin_box> ... <end_box> tags
    USE_VIDEO_R1_REASONING_PROMPT: "0"            # use the video r1 reasoning prompt template
    
    EB_SUPRESS_DURATION_LOGS: "0"                 # suppress duration logs in embodiedbench

    RUN_ALFRED: "1"                               # whether to run EB-ALFRED evaluations
    RUN_HABITAT: "1"                              # whether to run EB-Habitat
    RUN_MANIPULATION: "0"                         # whether to run EB-Manipulation
    RUN_NAVIGATION: "0"                           # whether to run EB-Nav

